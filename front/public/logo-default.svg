<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fond circulaire -->
  <circle cx="50" cy="50" r="48" fill="#1a56a0"/>

  <!-- Toit du bâtiment -->
  <polygon points="20,52 50,28 80,52" fill="white" opacity="0.95"/>

  <!-- Corps du bâtiment -->
  <rect x="28" y="52" width="44" height="28" fill="white" opacity="0.95"/>

  <!-- Porte centrale -->
  <rect x="43" y="65" width="14" height="15" fill="#1a56a0"/>

  <!-- Fenêtre gauche -->
  <rect x="32" y="57" width="9" height="8" fill="#1a56a0" opacity="0.7"/>

  <!-- Fenêtre droite -->
  <rect x="59" y="57" width="9" height="8" fill="#1a56a0" opacity="0.7"/>

  <!-- Drapeau -->
  <line x1="50" y1="14" x2="50" y2="28" stroke="white" stroke-width="1.5"/>
  <polygon points="50,14 60,18 50,22" fill="#f59e0b"/>
</svg>
